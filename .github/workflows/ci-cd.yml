name: CI/CD

on: [push, pull_request, workflow_dispatch]

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - "8"
          - "8-g5"
          - "8-g6"
          - "8-prod"
          - "11"
          - "11-g5"
          - "11-g6"
          - "11-prod"
          - "15"
          - "15-g5"
          - "15-g6"
          - "15-prod"
          - "16"
          - "16-g5"
          - "16-g6"
          - "16-prod"
          - "17"
          - "17-prod"
          - "21"
          - "21-prod"
          - "25"
          - "25-prod"
          - "26"
          - "26-prod"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: docker-buildx-${{ matrix.image }}-${{ github.sha }}
          restore-keys: docker-buildx-${{ matrix.image }}-

      - name: Build
        run: |
          docker buildx build \
            --cache-from type=local,src=/tmp/.buildx-cache/${{ matrix.image }} \
            --cache-to type=local,dest=/tmp/.buildx-cache/${{ matrix.image }} \
            --output type=docker \
            --tag kooldev/java:${{ matrix.image }} \
            ${{ matrix.image }}
      - name: Tests
        run: |
          docker run kooldev/java:${{ matrix.image }} java -version
          if [[ "${{ matrix.image }}" != *-prod ]]; then
            docker run kooldev/java:${{ matrix.image }} mvn -version
            docker run kooldev/java:${{ matrix.image }} gradle -version
          fi

  publish:
    needs: build-test
    if: github.ref == 'refs/heads/main' && github.repository == 'kool-dev/docker-java'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - "8"
          - "8-g5"
          - "8-g6"
          - "8-prod"
          - "11"
          - "11-g5"
          - "11-g6"
          - "11-prod"
          - "15"
          - "15-g5"
          - "15-g6"
          - "15-prod"
          - "16"
          - "16-g5"
          - "16-g6"
          - "16-prod"
          - "17"
          - "17-prod"
          - "21"
          - "21-prod"
          - "25"
          - "25-prod"
          - "26"
          - "26-prod"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        run: |
          docker buildx build \
            --push \
            --tag kooldev/java:${{ matrix.image }} \
            ${{ matrix.image }}
