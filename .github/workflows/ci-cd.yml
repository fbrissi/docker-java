name: CI/CD

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: [17, 21, 25]
        variant: ["", "-prod"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.version }}${{ matrix.variant }}
          load: true
          tags: kooldev/java:${{ matrix.version }}${{ matrix.variant }}

      - name: Test Java runtime
        run: |
          docker run kooldev/java:${{ matrix.version }}${{ matrix.variant }} java -version
          docker run -e ASUSER=1000 kooldev/java:${{ matrix.version }}${{ matrix.variant }} java -version

      - name: Test development tools
        if: matrix.variant == ''
        run: |
          docker run kooldev/java:${{ matrix.version }} mvn --version
          docker run kooldev/java:${{ matrix.version }} gradle --version
          docker run kooldev/java:${{ matrix.version }} jshell --version

  publish:
    if: github.ref == 'refs/heads/main' && github.repository == 'kool-dev/docker-java'
    needs: build-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: [17, 21, 25]
        variant: ["", "-prod"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.version }}${{ matrix.variant }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: kooldev/java:${{ matrix.version }}${{ matrix.variant }}
