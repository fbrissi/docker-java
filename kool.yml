scripts:
  template: kool docker fireworkweb/fwd:v1.0 fwd template
  build-supported:
    - kool run template
    - docker build --pull -t kooldev/java:17 17
    - docker build --pull -t kooldev/java:17-prod 17-prod
    - docker build --pull -t kooldev/java:21 21
    - docker build --pull -t kooldev/java:21-prod 21-prod
    - docker build --pull -t kooldev/java:25 25
    - docker build --pull -t kooldev/java:25-prod 25-prod
  build-legacy:
    # JAVA 16
    - docker build --platform linux/amd64 --pull -t kooldev/java:16 16
    - docker build --platform linux/amd64 --pull -t kooldev/java:16-g6 16-g6
    - docker build --platform linux/amd64 --pull -t kooldev/java:16-g5 16-g5
    - docker build --platform linux/amd64 --pull -t kooldev/java:16-prod 16-prod
    # JAVA 15
    - docker build --platform linux/amd64 --pull -t kooldev/java:15 15
    - docker build --platform linux/amd64 --pull -t kooldev/java:15-g6 15-g6
    - docker build --platform linux/amd64 --pull -t kooldev/java:15-g5 15-g5
    - docker build --platform linux/amd64 --pull -t kooldev/java:15-prod 15-prod
    # JAVA 11
    - docker build --platform linux/amd64 --pull -t kooldev/java:11 11
    - docker build --platform linux/amd64 --pull -t kooldev/java:11-g6 11-g6
    - docker build --platform linux/amd64 --pull -t kooldev/java:11-g5 11-g5
    - docker build --platform linux/amd64 --pull -t kooldev/java:11-prod 11-prod
    # JAVA 8
    - docker build --platform linux/amd64 --pull -t kooldev/java:8 8
    - docker build --platform linux/amd64 --pull -t kooldev/java:8-g6 8-g6
    - docker build --platform linux/amd64 --pull -t kooldev/java:8-g5 8-g5
    - docker build --platform linux/amd64 --pull -t kooldev/java:8-prod 8-prod
  build:
    - kool run build-supported
    - kool run build-legacy
